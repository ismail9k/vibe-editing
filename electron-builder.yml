# Packs the built app (out/) into "Vibe Editing.app". `npm run dist` makes the .app, `npm run dist:dmg` a disk image.
appId: com.ismail9k.vibe-editing
productName: Vibe Editing
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - presets/**
  - native/**
  - build/icon.png
  - package.json
# swiftc compiles the cutout helper from a real file path, so the Swift source stays outside the asar archive.
asarUnpack:
  - native/**
mac:
  category: public.app-category.video
  icon: build/icon.icns
  # Signed ad hoc ("-"): no certificate, but the whole bundle is sealed, so another Mac sees a valid app from an
  # unidentified developer (Privacy & Security → Open Anyway) instead of a broken one it refuses outright.
  # Opening with a plain double-click there needs a Developer ID Application certificate and notarisation.
  identity: "-"
  # The hardened runtime only matters for notarisation, and with no team behind the signature it can refuse to
  # load the app's own frameworks. Turn it back on together with a Developer ID.
  hardenedRuntime: false
  # A project folder (projects/<name>.vibe) is a document package: Finder shows it as one file with the app's icon,
  # and double-clicking it opens the app (main/index.ts handles the open-file event).
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.ismail9k.vibe-editing.project
        UTTypeDescription: Vibe Project
        UTTypeConformsTo: [com.apple.package, public.composite-content]
        UTTypeIconFile: icon.icns
        UTTypeTagSpecification:
          public.filename-extension: [vibe]
    CFBundleDocumentTypes:
      - CFBundleTypeName: Vibe Project
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSTypeIsPackage: true
        LSItemContentTypes: [com.ismail9k.vibe-editing.project]
        CFBundleTypeIconFile: icon.icns
# The installer window: the app on the left, the Applications folder on the right, drag one onto the other.
dmg:
  artifactName: Vibe-Editing-${version}-${arch}.dmg
  title: Vibe Editing
  # Drawn from build/dmg-background.svg (`npm run dmg:background`); the @2x file beside it is picked up for Retina.
  # The icon positions below are drawn into the picture, so move them together.
  background: build/dmg-background.png
  iconSize: 120
  iconTextSize: 12
  window:
    width: 660
    height: 420
  contents:
    - { x: 180, y: 190, type: file }
    - { x: 480, y: 190, type: link, path: /Applications }
